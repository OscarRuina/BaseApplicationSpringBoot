#######################################
## Test-only properties
#######################################
spring.datasource.url=jdbc:h2:mem:app_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# The suite runs on H2 and Hibernate builds the schema. The migrations are MySQL-only, so
# running them here fails every integration test at context load, not one of them.
spring.flyway.enabled=false
#######################################
#######################################
email.sender=test@example.com
email.password=test
