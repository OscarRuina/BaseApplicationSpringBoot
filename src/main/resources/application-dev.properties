#######################################
## Development-only properties
#######################################
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
app.seed.password=${APP_SEED_PASSWORD}
app.mail.template-cache=false
#######################################
## Local .env file
#######################################
# Read only in the dev profile, from the working directory. `optional:` makes a missing
# file a no-op, so a boot without one behaves exactly as before. The [.] hint pins the
# properties loader explicitly instead of relying on the extensionless-file fallback.
#
# Precedence: config imports are added with propertySources.addLast, so a real environment
# variable always wins over .env. Docker and CI are therefore unaffected by this line.
#
# This file is parsed as Java properties, not as a real dotenv: `#` opens a comment and `\`
# escapes, so a `#` inside a password truncates it silently and fails later, at connection
# time. It also cannot set SPRING_PROFILES_ACTIVE, since the profile decides whether this
# file is read at all.
spring.config.import=optional:file:.env[.properties]
