######################################
## Server properties
######################################
server.port=8085
######################################
## Application properties
######################################
# Context
######################################
server.servlet.context-path=/api
######################################
## Database properties
######################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
#######################################
## Flyway properties
#######################################
# ddl-auto=validate means the schema is owned by the migrations in db/migration, not by
# Hibernate. baseline-on-migrate only baselines a NON-empty schema, which is why V1 exists:
# an existing database is baselined at version 1 and skips V1, an empty one runs V1 and V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
#######################################
## Security properties
#######################################
jwt.token.secretKey=${TOKEN_SECRET_KEY}
jwt.token.expiration=3600000
#######################################
## Login throttle properties
#######################################
app.login.throttle.free-attempts=3
app.login.throttle.base-delay=1000
app.login.throttle.max-delay=30000
app.login.throttle.reset-after=900000
app.login.throttle.client-max-failures=30
app.login.throttle.client-window=300000
app.login.throttle.max-entries=10000
#######################################
## Email properties
#######################################
email.sender=${EMAIL}
email.password=${EMAIL_PASSWORD}
app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
app.mail.starttls=${MAIL_STARTTLS:true}
app.mail.auth=${MAIL_AUTH:true}
app.mail.connection-timeout=${MAIL_CONNECTION_TIMEOUT:5000}
app.mail.timeout=${MAIL_TIMEOUT:5000}
app.mail.write-timeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.template-cache=${MAIL_TEMPLATE_CACHE:true}
#######################################
## Frontend properties
#######################################
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
#######################################
## CORS properties
#######################################
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
#######################################